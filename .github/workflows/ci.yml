name: CI

on:
  push:
  pull_request:
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      # Fixed buggy/hidden/reference assets are benchmark data, not lint targets.
      - run: python -m ruff check src tests benchmarks/evaluation benchmarks/docker benchmarks/*.py
      - run: python -m pytest --cov=pyrepair --cov-report=term-missing -q
