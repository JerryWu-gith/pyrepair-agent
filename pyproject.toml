[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pyrepair-agent"
version = "0.1.0"
description = "A safe pytest diagnosis and candidate patch agent"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.27,<1",
    "openai>=1.99,<3",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.12,<1",
]

[project.scripts]
pyrepair = "pyrepair.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrepair", "src/_pyrepair_agent_internal"]

[tool.pytest.ini_options]
addopts = "-m 'not live and not docker'"
norecursedirs = ["tests/fixtures", "examples", "benchmarks/cases", "benchmarks/eval_cases", "benchmarks/eval_private", "benchmarks/review_cases", "benchmarks/review_cases_hard_v1", "benchmarks/results", "tmp", ".pyrepair", ".pytest_cache", ".worktrees", ".superpowers"]
markers = [
    "live: requires DEEPSEEK_API_KEY and makes a paid network request",
    "docker: explicitly selected real Docker integration; never implicit build/pull",
]

[tool.ruff]
target-version = "py311"
line-length = 100
